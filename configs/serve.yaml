# The definition of how Qwen3.8-27B is served.
#
# This is vLLM's own `vllm serve --config` format: keys are flag names without
# the leading `--`, nested maps are passed through as JSON, and command-line
# arguments override anything here.
#
# Most of these are wiring, not tuning: the INT8 checkpoint needs its MTP head,
# GDN linear-attention layers and fp8 KV cache configured explicitly, and
# omitting any of them degrades silently rather than failing.

model: lued/Qwen3.8-27B-INT8-W8A16-MTP
served-model-name: Qwen3.8-27B

tensor-parallel-size: 4
dtype: bfloat16
gpu-memory-utilization: 0.92
max-model-len: 262144
max-num-seqs: 4
max-num-batched-tokens: 8192

kv-cache-dtype: fp8_e4m3
mamba-cache-mode: align
prefix-match-unit: 16

host: 127.0.0.1
port: 8000
reasoning-parser: qwen3
tool-call-parser: qwen3_coder
enable-auto-tool-choice: true

trust-remote-code: true

# The 3090s here have no NVLink; the model card validates this for INT8.
disable-custom-all-reduce: true

# Only safe on an MTP checkpoint while vLLM honours drop_eagle_block in the
# Mamba cache lookup (vllm#48375). Otherwise a prefix-cache hit can resume from
# a rejected-draft state and serve wrong output with no error.
enable-prefix-caching: true

speculative-config:
  method: mtp
  num_speculative_tokens: 3

default-chat-template-kwargs:
  enable_thinking: true
  preserve_thinking: true

override-generation-config:
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  repetition_penalty: 1.0
  presence_penalty: 0.0
