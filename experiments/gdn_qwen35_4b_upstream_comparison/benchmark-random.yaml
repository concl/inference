# Recorded workload; result paths may be overridden for a new replication.
backend: openai-chat
base-url: http://127.0.0.1:8001
endpoint: /v1/chat/completions
model: Qwen3.5-4B
tokenizer: Qwen/Qwen3.5-4B
dataset-name: random
random-input-len: 1024
random-output-len: 128
num-prompts: 20
max-concurrency: 2
seed: 0
num-warmups: 2
percentile-metrics: ttft,tpot,itl
metric-percentiles: 50,95
save-result: true
result-dir: experiments/gdn_qwen35_4b_upstream_comparison/artifacts/bench
result-filename: bench-qwen35-4b-random.json
