# Recorded workload; result paths may be overridden for a new replication.
backend: openai-chat
base-url: http://127.0.0.1:8000
endpoint: /v1/chat/completions
model: Qwen3.8-27B
tokenizer: lued/Qwen3.8-27B-INT8-W8A16-MTP
dataset-name: sharegpt
dataset-path: ../benchmarks/ShareGPT_V3_unfiltered_cleaned_split.json
sharegpt-output-len: 32
num-prompts: 1
max-concurrency: 1
seed: 0
num-warmups: 1
ready-check-timeout-sec: 600
profile: true
save-result: true
result-dir: experiments/gdn_comparison/artifacts/bench
result-filename: bench-sharegpt.json
